# Plan 15 Task 6. Settings from lab.s01 (masked denoise with emissive protection, style-transfer reference). Generic prompt: no game text, no trademarks.
id: lab.s0a
kind: repaint
source: { background: s_040a }
sampling: { seed: 401010, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered close-up of a science-fiction control console, round ports, a coloured key strip, brushed grey metal, physically based materials, soft global illumination, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
# Step-down (R5): 1 point failed at 0.5 (exit hotspot top-left); 0.45 passed as PNG but its WebP did not (2 points), so 0.4.
denoise: 0.4
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
mask: { protect: 0.2, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
# The de-dither pre-step (tools/art/src/dedither.ts): the original's dither is averaged out before the 4x upscale, which otherwise
# turns it into streaks; edges, seam lines, displays (glow) and `keep` are left as they are.
# 2026-10-19 (PC CUDA via COMFY_URL): with the glow test on (glowSat 0.6) the runs at p0.2 and p0.15 passed but their WebPs failed the
# re-check (exit 0a00 top-left), and seed 401110 failed the run. The room has no display grid (its LCARS buttons are flat colour), so the
# glow test is off here (glowSat 2), which passed both checks.
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 2, glowLum: 2, glowGrow: 2 }
reference:
  - { refs: [mat.lcars.1, set.cargo.1.console, mat.lcars.3], model: style, weight: 1.0, weightType: style transfer }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
