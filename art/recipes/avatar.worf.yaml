# SPDX-License-Identifier: GPL-3.0-or-later
# Away-team avatar for worf, made as Riker's (avatar.riker.yaml, the user's pick id-real): a NEW picture from IP-Adapter FaceID on
# InsightFace embeddings of five show frames (face.3-7, seasons 5-7), the blurred game portrait as the layout (img2img at 0.9), a
# "realistic oil painting" prompt at cfg 4 with plus-face 0.4 and a palette transfer of 0.3, shown as the 64x64 k-means-32 pixel version.
# The frames were found by InsightFace over the cached episode scans (the largest faces nearest this person's face.1-2), square crops
# about the face; face.8-11 are held out and score the likeness, with the margin over the nearest other crew member.
id: avatar.worf
kind: avatar
object: worf
base: { sprite: smhdworf.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 40 }
identity:
  refs: [crew.worf.face.3, crew.worf.face.4, crew.worf.face.5, crew.worf.face.6, crew.worf.face.7]
  holdout: [crew.worf.face.8, crew.worf.face.9, crew.worf.face.10, crew.worf.face.11]
  others: [crew.picard.face.1, crew.picard.face.2, crew.riker.face.1, crew.riker.face.2, crew.data.face.1, crew.data.face.2, crew.troi.face.1, crew.troi.face.2, crew.crusher.face.1, crew.crusher.face.2, crew.la_forge.face.1, crew.la_forge.face.2]
# Run 2026-10-19 on the PC (likeness, smooth / pixel, against face.8-11; InsightFace finds Worf's face in every frame, so FaceID, no
# plus-face-only fallback):
#   id-real 0.46+0.32 / 0.44+0.27   id-dark 0.45+0.31 / 0.46+0.27
# Both overdo the ridges and paint a gold ornament on the forehead; id-dark (darker skin weighted, less palette pull toward the game's
# red) barely changes it. Picked: id-dark, the better pixel score.
pick: grab
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600, refCount: 3 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
# The pick (the user's, 2026-10-19, treatment B of the grab probe): the full show frame behind its ref, its face box fitted to the game portrait's, the person
# cut out by BiRefNet (portrait) with pymatting's foreground colours, graded halfway to the game figure, on the portrait's own backdrop
# (art avatar <recipe> --variant grab; grab.ts). The variants below are the earlier rounds, kept.
grab:
  ref: crew.worf.face.4
  gameFace: [8.95, 13.82, 29.88, 43.06]
  matte: { model: birefnet-portrait, feather: 1 }
  grade: 0.5
variants:
  - name: id-real
    model: sdxl
    sampling: { seed: 73008, steps: 30, cfg: 4, sampler: dpmpp_2m, scheduler: karras }
    prompt: >-
      realistic oil painting portrait of Lieutenant Worf from Star Trek: The Next Generation (Michael Dorn) the Klingon, head and
      shoulders, slight three-quarter view, ridged Klingon forehead, dark brown skin, long dark brown hair, beard and goatee, stern
      expression, gold uniform with a silver metal baldric sash across the chest, warm key light from the right, cool blue shadows, dark
      blue background, painted brushwork
    negative: photograph, photo, 3d render, smooth airbrushed skin, cartoon, anime, text, watermark, signature, deformed, blurry, human forehead, clean-shaven, hat, helmet
    denoise: 0.9
    faceid:
      - { model: ip-adapter-faceid-plusv2-sdxl, lora: { model: ip-adapter-faceid-plusv2-sdxl-lora, strength: 0.7 }, weight: 1.0, v2: 1.5 }
      - { model: ip-adapter-faceid-portrait-sdxl-unnorm, weight: 0.8 }
    plusFace: { weight: 0.4 }
    palette: 0.3
  - name: id-dark
    model: sdxl
    sampling: { seed: 73008, steps: 30, cfg: 4, sampler: dpmpp_2m, scheduler: karras }
    prompt: >-
      realistic oil painting portrait of Lieutenant Worf from Star Trek: The Next Generation (Michael Dorn) the Klingon, head and
      shoulders, slight three-quarter view, ridged Klingon forehead, (dark brown skin:1.3), natural human-like Klingon face, long dark
      brown hair, beard and goatee, calm stern expression, gold uniform with a silver metal baldric sash across the chest, warm key
      light from the right, cool blue shadows, dark blue background, painted brushwork
    negative: photograph, photo, 3d render, smooth airbrushed skin, cartoon, anime, text, watermark, signature, deformed, blurry, human forehead, clean-shaven, hat, helmet, red skin, orange skin, forehead emblem, jewellery, exaggerated features
    denoise: 0.9
    faceid:
      - { model: ip-adapter-faceid-plusv2-sdxl, lora: { model: ip-adapter-faceid-plusv2-sdxl-lora, strength: 0.7 }, weight: 1.0, v2: 1.5 }
      - { model: ip-adapter-faceid-portrait-sdxl-unnorm, weight: 0.8 }
    plusFace: { weight: 0.4 }
    palette: 0.1
