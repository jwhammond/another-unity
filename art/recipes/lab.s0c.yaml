# Plan 15 Task 6. Settings from lab.s01 (masked denoise with emissive protection, style-transfer reference). Generic prompt: no game text, no trademarks.
id: lab.s0c
kind: repaint
source: { background: s_040c }
sampling: { seed: 401012, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered close-up of a science-fiction tan control panel, sliders and two small displays, physically based materials, soft global illumination, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
denoise: 0.5
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
# 2026-10-19 (dedither, PC CUDA via COMFY_URL): at protect 0.2 the exit 0c0a bottom-right corner moved 2.2 px; stepped down to protect 0.15.
mask: { protect: 0.15, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
# The de-dither pre-step (tools/art/src/dedither.ts): the original's dither is averaged out before the 4x upscale, which otherwise
# turns it into streaks; edges, seam lines, displays (glow) and `keep` are left as they are.
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
reference:
  - { refs: [mat.lcars.2, mat.lcars.1, set.cargo.1.console], model: style, weight: 1.0, weightType: style transfer }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
