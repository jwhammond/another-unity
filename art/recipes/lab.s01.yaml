# The first proof plate (Plan 14 Task 10). Generic prompt: no game text, no trademarks.
# Tuned for "faithful, modernised" in Task 4 (base SDXL at 30 steps, no Lightning). Notes on what was tried:
#   Plan 14 Task 5: without working ControlNets, at denoise 0.3 two of 60 measured points moved past 2 px; at 0.25 all pass.
#   A "painted adventure-game" prompt smeared the surfaces; a "3D rendered, physically based" one kept them clean.
id: lab.s01
kind: repaint
source: { background: s_0401 }
sampling: { seed: 401001, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered science-fiction laboratory interior, physically based materials, soft global illumination,
  crisp detail, muted green and grey palette, grey-green wall panels
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
denoise: 0.55
# Plan 15 Task 5: MASKED denoise (differential diffusion, tools/art/src/maskdenoise.ts). `denoise` is what open surfaces get; the
# soft mask from the lifted room and the original (hotspot corners and outlines, small hotspot rects, floor edges, strong edges)
# gives protected zones `protect` of the schedule. The mask value is a fraction of the sampled TIMESTEP range, not a KSampler
# denoise: protect 0.4 still failed 3-4 points, 0.2 holds (sweeps sweep-mask-a..d in the cache; d0.6 p0.2 worst 1.45 px, d0.65 p0.18
# 1.50 px, mean change vs the d0.30 plate 2.8 and 3.3 levels against 1.0 before). Uniform 0.4 and plain d0.6 fail 1 and 12 points.
# 2026-10-19 (dedither, PC CUDA via COMFY_URL): d0.6 p0.2 timed out, d0.6 p0.15 failed one point on its match (power monitor bottom-right,
# peak 0.494 < 0.5, shift 0.4 px); stepped down to denoise 0.55 at protect 0.15.
mask: { protect: 0.15, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
# The de-dither pre-step (tools/art/src/dedither.ts): the original's dither is averaged out before the 4x upscale, which otherwise
# turns it into streaks; edges, seam lines, displays (glow) and `keep` are left as they are.
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
# ControlNet windows are relative to the sampled steps (0 = first, 1 = last; default 0-1), see tools/art/src/sigmas.ts.
# Plan 15 Task 3 sweep (art/bench/2026-10-17-cn-window.yaml, seed 401001, windows 0-1): without ControlNets alignment fails
# from denoise 0.35 (5 points; 21 at 0.45, 44 at 0.55, where the room is reinvented). With depth+lineart it holds at 0.25-0.3
# and fails at 0.35 on a single point (floor r18 #1) at every strength tried (0.5/0.4 to 1.3/1.1); 0.4-0.55 fail on 3-16.
# Strengths 1.0/0.9 at 0.3 give the best worst shift (1.50 px, drift 0.23); stronger buys nothing. Higher denoise needs
# masked or per-room handling (Task 5), not stronger ControlNets.
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
# Plan 15 Task 4: an IP-Adapter style reference (ip-adapter-plus SDXL, `style transfer` = the style-only blocks, so no layout comes
# from it) with a show set and a console panel. Sweep at denoise 0.30, same seed, alignment worst shift / mean change vs the
# Task 3 plate (levels of 255): style transfer 0.4 1.45 px / 0.57; 0.6 1.42 / 0.70; 0.8 1.40 / 0.84; 1.0 1.37 / 1.01 (all pass).
# `strong style transfer` 1.0 and 1.5 and `linear` 0.8 and 1.2 change more (1.3-2.7) but misalign (4.3 px at the power chair,
# or a floor point): not usable at 0.30. Chosen: style transfer 1.0, the strongest that passes. Even so the change is a slight
# warm/cream shift of the walls and light, not the show's surfaces: at 0.30 denoise the adapter has few steps to act on.
# References are people-free crops (the earlier set.lab.2 had crew in it).
reference:
  - { refs: [mat.lcars.1, set.science.1.wall, set.lab.2.wall], model: style, weight: 1.0, weightType: style transfer }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
