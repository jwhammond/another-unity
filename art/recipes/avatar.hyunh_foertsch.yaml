# SPDX-License-Identifier: GPL-3.0-or-later
# Portrait for Dr. Hyunh-Foertsch, a game-only character (icon.map: w3shvihn.spr, the dialog's speaker icon): no show footage and no actor, so no FaceID and no
# likeness score. Same technique as butler and carlstrom: the Krea 2 Turbo variant paints the face from the game portrait as layout (lightly
# blurred), then the grab sets that person into the game portrait's frame (face box fitted, BiRefNet matte, graded halfway to the game figure,
# the portrait's own backdrop) and the pixel step makes the 64x64 avatar. Published under the object ids in speakers: the subtitle looks its
# speaker up by the game's object name.
# The game portrait's head is cropped by the sprite's top edge, so InsightFace's box starts above it (y -6.25). A hand-measured box inside the
# sprite (8.5 to 38.5) fitted the source too small and left the head's top smeared across the sprite's edge.
id: avatar.hyunh_foertsch
kind: avatar
object: hyunh_foertsch
speakers: [zoo.dr_hyunh_foertsch.0900, zoo.dr_hyunh_foertsch.030a]
base: { sprite: w3shvihn.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 6 }
pick: grab
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
grab:
  from: krea2
  gameFace: [12.23, -6.25, 36.32, 31.97]
  matte: { model: birefnet-portrait, feather: 1 }
  grade: 0.5
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 76007, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, Dr. Hyunh-Foertsch, a civilian woman in her thirties, a zoologist, head and shoulders with room above the head,
      slight three-quarter view, long dark brown hair under a deep blue hood, pale skin, dark eyebrows, red lips, a calm intelligent
      expression, a plain blue hooded cloak, nothing pinned or fastened on it, no pins, no insignia, no badge, dark teal background, warm key light from the right,
      painted 1990s adventure game portrait
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark
    denoise: 0.8
    loras: [{ model: krea2-tng-setting-lora, strength: 0.7 }]
