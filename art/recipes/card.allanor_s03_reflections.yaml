# Batch 8d rollout (Allanor), water reflections (19 frames, a loop): w2s3rflx.spr. `prop.animate` publishes every frame the original plays as a strip (docs/unity-sprite-placement.md, "Batch 8d"). Generic prompt: no game text.
id: card.allanor_s03_reflections
kind: card
object: allanor_s03_reflections
sprite: w2s3rflx.spr
anims: [0]
prop: { screen: allanor.s03, objects: [allanor.o0310], anim: 0, animate: [0] }
group: 4
repaint: false
align: { skip: true, reason: "the repaint failed the card check twice, the second time on speckle alone, nothing measured moved: 9 to 11 of the 16 to 17 strongest windows of frames 10 to 13 are speckle (worst shift 1.15 px); allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 95106, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  photograph of rippling blue light reflected on a dark wet cavern wall, soft light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, letters, watermark, deformed, people, blurry
denoise: 0.25
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
