# Constable Lliksze: a game-only picture (icon.map: w3shllik, the dialog's speaker icon), no show footage, so no FaceID and no grab. The non-face path of the portraits:
# the Krea 2 Turbo variant repaints the game's own picture as layout (img2img at a high denoise, so its shape and colours stay and its painting
# is new), and the pixel step makes the 64x64 picture. Published under the object ids in speakers: the subtitle looks its speaker up by the game's object name.
id: avatar.lliksze
kind: avatar
object: lliksze
speakers: [zoo.constable_lliksze.030e, zoo.constable_lliksze.1010]
base: { sprite: w3shllik.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 2 }
pick: krea2
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 77302, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, Constable Lliksze, an alien lawman with a painted face like a carnival mask, the upper face bright red with
      yellow-ringed eyes, the lower face bright blue with a red mouth, a thick shaggy grey mane framing the whole face and falling to
      the shoulders, head and shoulders on a plain background, a rubber-masked alien character of an early 1990s television science
      fiction series, painted 1990s adventure game portrait, plain tan background
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark
    denoise: 0.7
    loras: [{ model: krea2-tng-setting-lora, strength: 0.4 }]
