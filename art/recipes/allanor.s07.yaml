# M6: allanor room 07. Settings from the lab.s05 step-down, protect tightened to 0.1 after the first M6 samples missed by 1-2 points at 0.15 (masked denoise, see lab.s01). Generic prompt: no game text.
# Re-run 2026-10-20 (4080, 4 runs): denoise 0.2/0.12/0.05 and dedither passes 2, pointRadius 55, lineart 1.0 all leave floor r25 #2 (401,345) at (4,-3) px; the shift is the same at 0.05, so it is the sampler/VAE pass flattening the dither there, not the repaint. Upscaled+dedithered plates pass.
id: allanor.s07
kind: repaint
# 2026-10-20 (user): upscale-only plate, like allanor.s14: the de-dithered 4x upscale, no diffusion pass. The repaint drifted one point 6-7.5 px
# (beyond the warp's 5 px cap); the plain upscale keeps the original's geometry. The alignment check still runs.
repaint: false
source: { background: s_0207 }
sampling: { seed: 207007, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
# Step-down 3 (M6): still (1 of 38 measured points fail; worst floor r25 #2); new seed 200007 -> 207007.
prompt: >-
  3D rendered alien starship interior from Star Trek: The Next Generation, dark angular biomechanical machinery, deep indigo and violet metal, glossy blue-black surfaces with teal accent lights, physically based materials, soft global illumination, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
# Step-down 1 (M6): (1 of 35 measured points fail; worst floor r25 #2); denoise 0.45 -> 0.35.
# Step-down 2 (M6): still (1 of 36 measured points fail; worst floor r25 #2); denoise 0.35 -> 0.25 (protect already 0.15).
denoise: 0.2
depth: { strength: 1.0 }
lineart: { strength: 1.0 }
mask: { protect: 0.1, pointRadius: 55, band: 20, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
