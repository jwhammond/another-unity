# Batch 8g rollout (zoo), the sensor `0712` of `s07` (off at entry, 7 frames, a loop): w3s7sens.spr. `prop.animate` publishes every frame the original plays as a strip (docs/unity-sprite-placement.md, "Batch 8g"). Generic prompt: no game text.
id: card.zoo_sensor_0712
kind: card
object: zoo_sensor_0712
sprite: w3s7sens.spr
anims: [0]
prop: { screen: zoo.s07, objects: [zoo.sensor.0712], anim: 0, animate: [0] }
group: 3
repaint: false
align: { skip: true, reason: "the repaint failed the card check on speckle alone, nothing measured moved (worst shift 0.10 px, flicker median 5.2): 2 of the 3 strongest windows of frame 1 are speckle; allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 98016, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  photograph of a small blinking red sensor light on a post, science fiction, soft light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, letters, watermark, deformed, people, blurry
denoise: 0.25
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
