# SPDX-License-Identifier: GPL-3.0-or-later
# Tracker Melas: a game-only picture (icon.map: w3shmela, the dialog's speaker icon), no show footage, so no FaceID and no grab. The non-face path of the portraits:
# the Krea 2 Turbo variant repaints the game's own picture as layout (img2img at a high denoise, so its shape and colours stay and its painting
# is new), and the pixel step makes the 64x64 picture. Published under the object ids in speakers: the subtitle looks its speaker up by the game's object name.
id: avatar.melas
kind: avatar
object: melas
speakers: [zoo.tracker_melas]
base: { sprite: w3shmela.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 2 }
pick: krea2
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 77306, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, Tracker Melas, a bald grey-skinned alien man with a heavily lined face, a long flat nose with a vertical ridge,
      small tired eyes, a downturned mouth, wrinkled pale grey-pink skin, a plain red high-collared shirt, head and shoulders on a
      plain brown background, painted 1990s adventure game portrait
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark
    denoise: 0.7
    loras: [{ model: krea2-tng-setting-lora, strength: 0.4 }]
