# M6: static repaint of a viewscreen caller (see hail.mertens). Generic prompt: no game text, no actor or character names.
id: hail.admr
kind: repaint
source: { hail: viewadmr }
sampling: { seed: 178000, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
# Step-down 3 (M6): still alignCheck: a 2120x1008 plate isn't a whole multiple of the 520x244 original; new seed 171000 -> 178000.
prompt: >-
  portrait photograph of a middle-aged woman with short brown hair and a calm serious expression, realistic skin, red and black futuristic uniform, seated at a console in a pale panelled starship office, soft cinematic light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, watermark, deformed, extra people, extra limbs, blurry
# Step-down 1 (M6): alignCheck: a 2120x1008 plate isn't a whole multiple of the 520x244 original; denoise 0.35 -> 0.25.
# Step-down 2 (M6): still alignCheck: a 2120x1008 plate isn't a whole multiple of the 520x244 original; denoise 0.25 -> 0.15 (protect already 0.15).
denoise: 0.15
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
size: { work: [1536, 720], out: [2080, 976] }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
