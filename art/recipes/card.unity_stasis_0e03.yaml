# Batch 8f rollout (Unity), the stasis chamber `0e03` of `s0e` (the sprite of `unity.s08`'s `0804`, same prompt and seed as `card.unity_stasis_s08a`; on at entry on animation 0, `panel.0e01` plays 1, 16 frames): w6s8grfr.spr. `prop.animate` publishes every frame the original plays as a strip (docs/unity-sprite-placement.md, "Batch 8f"). Generic prompt: no game text.
id: card.unity_stasis_0e03
kind: card
object: unity_stasis_0e03
sprite: w6s8grfr.spr
anims: [0, 1]
prop: { screen: unity.s0e, objects: [unity.stasis_chamber.0e03], anim: 0, animate: [0, 1] }
group: 3
repaint: false
align: { skip: true, reason: "the repaint failed the card check on speckle alone, nothing measured moved: 15 to 19 of the 27 to 31 strongest windows of animation 1's last frames are speckle (worst shift 0.88 px, flicker median 5.7); allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 92126, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  a person frozen inside a curved glass stasis capsule with frosted glass and metal frame, red figure, physically based materials, soft light, sharp focus
negative: blurry, painting, cartoon, cel shading, pixel art, text, watermark, deformed, extra limbs, extra people, noisy, speckled
denoise: 0.3
depth: { strength: 0.8 }
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
