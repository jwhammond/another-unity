# Plan 15 Task 5: the shaft, a catwalk ring and conduits. Settings from lab.s01 (masked denoise, see there). Generic prompt: no game text, no trademarks.
id: lab.s04
kind: repaint
source: { background: s_0404 }
sampling: { seed: 401204, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered science-fiction power shaft interior, curved dark walls, bronze power conduits, rows of warm lights, metal catwalks, physically based materials, soft global illumination, crisp detail, muted grey and bronze palette
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
# Step-down (R5): one low-contrast corner point at the right image border (x 638) failed at 0.6, 0.55 and 0.5 with emissive protection for seed 401004; a new seed (401104) at 0.55 passes.
# 2026-10-19 (dedither, PC CUDA via COMFY_URL): seed 401104 d0.55 passed but its WebP failed the re-check (catwalk 040a bottom-right),
# d0.5 failed next_room 0402 bottom-left; a new seed (401204) at 0.55.
denoise: 0.55
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
mask: { protect: 0.15, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
# The de-dither pre-step (tools/art/src/dedither.ts): the original's dither is averaged out before the 4x upscale, which otherwise
# turns it into streaks; edges, seam lines, displays (glow) and `keep` are left as they are.
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
reference:
  - { refs: [set.cargo.1.stairs, set.cargo.2, set.science.1.wall], model: style, weight: 1.0, weightType: style transfer }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
