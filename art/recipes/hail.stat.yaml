# M6: static repaint of a viewscreen caller (see hail.mertens). Generic prompt: no game text, no actor or character names.
id: hail.stat
kind: repaint
source: { hail: viewstat }
sampling: { seed: 171011, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  portrait photograph of a young woman with black hair, red and black futuristic uniform, standing in a bright white space-station corridor with windows to space, soft cinematic light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, watermark, deformed, extra people, extra limbs, blurry
denoise: 0.35
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
size: { work: [1536, 728], out: [2120, 1008] }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
