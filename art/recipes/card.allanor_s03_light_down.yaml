# Batch 8d rollout (Allanor), a light shaft of the third room (4 frames, a loop): w2s3ltdn.spr. `prop.animate` publishes every frame the original plays as a strip (docs/unity-sprite-placement.md, "Batch 8d"). Generic prompt: no game text.
id: card.allanor_s03_light_down
kind: card
object: allanor_s03_light_down
sprite: w2s3ltdn.spr
anims: [0]
prop: { screen: allanor.s03, objects: [allanor.o0302], anim: 0, animate: [0] }
group: 4
repaint: false
align: { skip: true, reason: "the repaint failed the card check on speckle alone, nothing measured moved: 4 to 5 of the 5 to 6 strongest windows of every frame are speckle (worst shift 0.12 px); allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 95007, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  photograph of a shaft of pale blue light falling through dark cavern air, science fiction set, soft light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, letters, watermark, deformed, people, blurry
denoise: 0.3
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
