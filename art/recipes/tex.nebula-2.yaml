# Plan 30 Task 6: backdrop plate 2 (M8 spec Decision 14; R13), the battles whose scenario is 2 mod 4. Our own: a generic prompt, no
# game source. Tileable (the backdrop repeats every 1920 units, as the stars wrap), checked by the seam ratio.
id: tex.nebula-2
kind: texture
sampling: { seed: 300203, steps: 30, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  seamless tileable deep space nebula, soft wispy clouds of glowing gas in amber and dusky red, faint dust lanes, mostly dark,
  no stars, no planets, smooth gradients, high detail
negative: >-
  stars, planets, text, watermark, logo, frame, border, vignette, hard edges, spaceship, people
size: 1024
seam: { band: 96, denoise: 0.8 }
post:
  - tilePreview: true
