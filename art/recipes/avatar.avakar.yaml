# SPDX-License-Identifier: GPL-3.0-or-later
# Portrait for Avakar, a game-only character in the conference lounge conversation (icon.map: w5shavak.spr, the dialog's speaker icon): no show
# footage and no actor, so no FaceID and no likeness score. Same technique as butler and carlstrom: the Krea 2 Turbo variant paints the
# face from the game portrait as layout (lightly blurred), then the grab sets that person into the game portrait's frame (face box
# fitted, BiRefNet matte, graded halfway to the game figure, the portrait's own backdrop) and the pixel step makes the 64x64 avatar.
# Published under the object's ids (speakers): the subtitle looks its speaker up by the game's object name.
id: avatar.avakar
kind: avatar
object: avakar
speakers: [ship.avakar.0402]
base: { sprite: w5shavak.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 6 }
pick: grab
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
grab:
  from: krea2
  gameFace: [10.52, 8.23, 35.59, 40.7]
  matte: { model: birefnet-portrait, feather: 1 }
  grade: 0.5
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 76003, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, Avakar, a young alien man of the Garidian people, TNG-era Romulan features: pointed Vulcanoid ears, a pronounced
      Romulan forehead brow ridge, angular sharply upswept eyebrows, head and shoulders, slight three-quarter view, short silver grey
      hair in a Romulan bowl cut with a straight fringe, tanned skin, clean-shaven, an earnest calm expression, smooth plain high stiff grey-
      green collar over a brown-orange tunic, nothing pinned or fastened on it, no pins, no insignia, no badge, warm key light from the right, cool blue shadows, dark
      blue background, painted 1990s adventure game portrait
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark, round human ears, plain human forehead, soft rounded eyebrows
    denoise: 0.8
    loras: [{ model: krea2-tng-setting-lora, strength: 0.7 }]
