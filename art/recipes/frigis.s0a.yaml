# M6: frigis room 0a. Settings from the lab.s05 step-down, protect tightened to 0.1 after the first M6 samples missed by 1-2 points at 0.15 (masked denoise, see lab.s01). Generic prompt: no game text.
# Re-run 2026-10-20 (4080, 3 runs, denoise 0.2/0.15/0.1, protect 0.05/0, pointRadius 50/70, seeds 507010/508010): down to 1 of 50 points, frigis.door.0a03 bottom-left (x 5, border) at 2.54-2.62 px, stable across denoise.
id: frigis.s0a
kind: repaint
source: { background: s_050a }
sampling: { seed: 508010, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
# Re-run (2026-10-20, 4080): one more seed (508010) at denoise 0.25 still fails (4 of 51 points, worst frigis.door.0a03 top-left); seed put back.
# Step-down 3 (M6): still (2 of 52 measured points fail; worst hotspot frigis.door.0a03 bottom-left); new seed 500010 -> 507010.
prompt: >-
  3D rendered desert planet landscape, red sandstone mesas, a woven clay hut with warm glowing doorway, ochre and rust palette, dusk sky with soft clouds, physically based materials, soft global illumination, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
# Step-down 1 (M6): (2 of 52 measured points fail; worst hotspot frigis.door.0a03 top-left); denoise 0.45 -> 0.35.
# Step-down 2 (M6): still (2 of 52 measured points fail; worst hotspot frigis.door.0a03 top-left); denoise 0.35 -> 0.25 (protect already 0.15).
denoise: 0.1
depth: { strength: 1.0 }
lineart: { strength: 1.0 }
