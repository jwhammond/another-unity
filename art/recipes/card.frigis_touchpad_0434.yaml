# Batch 8e rollout (Frigis), the touch pad `0434` of `s04` (one frame; a script sets its state, which the picture does not follow): w5s4pdys.spr. A still of the sprite's frame 0 upscaled 4x and lightly repainted, silhouette kept exactly; `prop` has `art masks` stand it over the plate while the object is active. Generic prompt: no game text.
id: card.frigis_touchpad_0434
kind: card
object: frigis_touchpad_0434
sprite: w5s4pdys.spr
anims: [0]
prop: { screen: frigis.s04, objects: [frigis.touchpad.0434], anim: 0 }
group: 1
repaint: false
align: { skip: true, reason: "the repaint failed the card check on speckle alone, nothing measured moved: 5 of the 9 strongest windows are speckle (worst shift 0.32 px); allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 96013, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  photograph of a pale blue tilted touch keypad of small square buttons set into a wall, science fiction control pad, soft studio light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, letters, watermark, deformed, people, blurry
denoise: 0.3
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
