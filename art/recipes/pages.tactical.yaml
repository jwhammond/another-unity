# SPDX-License-Identifier: GPL-3.0-or-later
# Plan 30 Task 3: the console's own pictures it repaints (R5: the pages', the tabs', every button's states and their stand-ins), laid
# on one 800 x 600 atlas by art:space originals, repainted as the plate is at M6's settled denoise (0.45, protect 0.1), then cut back
# into pictures with their clear pixels. Generic prompt: no game text, no trademarks.
id: pages.tactical
kind: repaint
source: { space: pages }
sampling: { seed: 300002, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered starship control panel buttons and readouts, flat backlit touch panels with rounded coloured bars on black,
  physically based materials, soft lighting, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
denoise: 0.45
mask: { protect: 0.1, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
size: { work: [1280, 960], out: [3200, 2400] }
reference:
  - { refs: [set.astrogation.tactical.1, set.bridge.lcars.1], model: style, weight: 1.0, weightType: style transfer }
post:
  - align: { maxShift: 2 }
