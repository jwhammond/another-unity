# M6: allanor room 05. Settings from the lab.s05 step-down, protect tightened to 0.1 after the first M6 samples missed by 1-2 points at 0.15 (masked denoise, see lab.s01). Generic prompt: no game text.
id: allanor.s05
kind: repaint
source: { background: s_0205 }
sampling: { seed: 200005, steps: 30, cfg: 4.5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  3D rendered alien starship interior from Star Trek: The Next Generation, dark angular biomechanical machinery, deep indigo and violet metal, glossy blue-black surfaces with teal accent lights, physically based materials, soft global illumination, crisp detail
negative: blurry, painting, cartoon, cel shading, text, watermark, people, extra objects, warped perspective
# Step-down 1 (M6): (3 of 68 measured points fail; worst hotspot allanor.grate top-right); denoise 0.45 -> 0.35.
# Step-down 2 (M6): still (2 of 70 measured points fail; worst hotspot allanor.grate top-right); denoise 0.35 -> 0.25 (protect already 0.15).
# Step-down 1 (M6): (1 of 70 measured points fail; worst hotspot allanor.grate top-right); denoise 0.25 -> 0.15.
denoise: 0.15
depth: { strength: 1.0 }
lineart: { strength: 0.9 }
mask: { protect: 0.1, pointRadius: 30, band: 12, emissiveSat: 0.35, emissiveVal: 0.3, emissiveLum: 0.88, emissiveGrow: 3 }
dedither: { method: bilateral, sigma: 1.5, factor: 3, minRange: 12, range: 72, passes: 3, glowSat: 0.6, glowLum: 2, glowGrow: 2 }
post:
  - depth: { resolution: 1024 }
  - align: { maxShift: 2 }
