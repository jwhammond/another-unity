# Batch 8g rollout (zoo), the leaf of `s01` (3 frames, a loop): leaf2.spr. `prop.animate` publishes every frame the original plays as a strip (docs/unity-sprite-placement.md, "Batch 8g"). Generic prompt: no game text.
id: card.zoo_leaf_s01
kind: card
object: zoo_leaf_s01
sprite: leaf2.spr
anims: [0]
prop: { screen: zoo.s01, objects: [zoo.leaf], anim: 0, animate: [0] }
group: 3
repaint: false
align: { skip: true, reason: "the repaint failed the card check on speckle alone, nothing measured moved (worst shift 0.40 px, flicker median 3.7): frame 2: 5 of its 9 strongest windows are speckle; allowed only because repaint is false, the upscale is the original's own pixels at 4x" }
sampling: { seed: 98004, steps: 20, cfg: 5, sampler: dpmpp_2m, scheduler: karras }
prompt: >-
  photograph of a large green leaf swaying on a branch, daylight, soft light, sharp focus
negative: cartoon, painting, cel shading, pixel art, text, letters, watermark, deformed, people, blurry
denoise: 0.25
lineart: { strength: 1.0 }
checks: { flickerRatio: 2.5, flickerMax: 14, deltaE: 14, speckle: 0.85 }
