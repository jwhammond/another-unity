# SPDX-License-Identifier: GPL-3.0-or-later
# Optimator One: a game-only picture (icon.map: w2shopt1, the dialog's speaker icon), no show footage, so no FaceID and no grab. The non-face path of the portraits:
# the Krea 2 Turbo variant repaints the game's own picture as layout (img2img at a high denoise, so its shape and colours stay and its painting
# is new), and the pixel step makes the 64x64 picture. Published under the object ids in speakers: the subtitle looks its speaker up by the game's object name.
id: avatar.optimator_one
kind: avatar
object: optimator_one
speakers: [allanor.optimator_one.0810, allanor.optimator_one.0908, allanor.optimator_one.0b10, allanor.optimator_one.0c07, allanor.optimator_one.0d05, allanor.optimator_one.0e0b, allanor.optimator_one.1403, allanor.alien.0705, allanor.alien.061a]
base: { sprite: w2shopt1.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 2 }
pick: krea2
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 77308, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, an Optimator, an insect-eyed alien face of an early 1990s television science fiction series, a smooth pale grey-
      blue skull with two huge glossy orange almond-shaped eyes, a ridged flat nose and a thin grim mouth, deep blue veined folds
      around the face and neck, seen from the front, head and shoulders, dark blue background, painted 1990s adventure game portrait, a
      pale grey smooth crown
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark
    denoise: 0.7
    loras: [{ model: krea2-tng-setting-lora, strength: 0.4 }]
