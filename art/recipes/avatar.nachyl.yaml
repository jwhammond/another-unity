# SPDX-License-Identifier: GPL-3.0-or-later
# Portrait for Nachyl, a game-only character (icon.map: w5shnach.spr, the dialog's speaker icon): no show footage and no actor, so no FaceID and no
# likeness score. Same technique as laraq and griems: the Krea 2 Turbo variant paints the face from the game portrait as layout (lightly blurred), then the
# grab sets that person into the game portrait's frame (face box fitted, BiRefNet matte, graded halfway to the game figure, the portrait's own
# backdrop: the black or dark one, found from the pixels joined to the picture edge) and the pixel step makes the 64x64 avatar. Nachyl's backdrop is black and dark grey (the grab's `backdrop: dark`); the box is InsightFace's on the game head scaled up 10x. Published under the object ids in speakers: the subtitle
# looks its speaker up by the game's object name.
id: avatar.nachyl
kind: avatar
object: nachyl
speakers: [frigis.nachyl]
base: { sprite: w5shnach.spr, frame: 0 }
size: { work: 1024, out: 256 }
layout: { blur: 6 }
pick: grab
sheet: { name: compare, columns: 3, pairs: true, smooth: 512, maxWidth: 1600 }
pixel: { grid: [64, 64], filter: area, palette: { kmeans: 32 }, dither: none }
grab:
  from: krea2
  gameFace: [14.12, 6.38, 33.91, 32.75]
  backdrop: dark
  matte: { model: birefnet-portrait, feather: 1 }
  grade: 0.5
variants:
  - name: krea2
    model: krea2
    sampling: { seed: 77202, steps: 8, cfg: 2.5, sampler: er_sde, scheduler: simple }
    prompt: >-
      Star Trek tng, Nachyl, a man of the planet Frigis in his thirties, head and shoulders with room above the head, slight three-
      quarter view, long straight black hair parted in the middle and falling past the shoulders, light tan skin, dark narrow eyes, a
      thin dark moustache, a grave expression, a loose pale cream tunic open at the neck with a plain red cord, nothing pinned or
      fastened on it, no pins, no insignia, no badge, warm key light from the right, plain dark grey background, painted 1990s
      adventure game portrait
    negative: rank pips, collar pips, insignia, combadge, badge, delta emblem, Starfleet uniform, pins, medals, buttons, studs, snaps, rivets, clasps, dots or metal on the collar, text, watermark
    denoise: 0.8
    loras: [{ model: krea2-tng-setting-lora, strength: 0.7 }]
