# The models Plan 14 may use: pinned by URL and sha256, and gated by the licence on each model's card (R4).
# A file whose sha256 differs from the one here is refused. Files live in ~/pcode/unity-art-cache/models, never in git.
# Licence policy (the user, 2026-10-18): this is a personal project, so non-commercial and gated models are ALLOWED for experiments.
# They are role `experimental` only, each names its `family` (a recipe's `model:`), and no `selected` job may name one: the
# allow-list above still governs what the published art uses. Experimental files live on the COMFY_URL server only
# (`remoteOnly: true`): `art fetch` skips them, the local hash check does not apply, and their sha256 is Hugging Face's LFS oid
# (recorded, not provable remotely; the server lists them by name). Krea 2 Turbo (family krea2: its fp8 diffusion model, its Qwen3-VL
# text encoder and the TNG LoRA, with the Qwen-Image VAE) is on the COMFY_URL server for art avatar's krea2 variants (2026-10-19).
# InsightFace and the IP-Adapter FaceID family: ALLOWED by the user (2026-10-19) for this personal project. The licence is
# non-commercial (InsightFace's buffalo_l weights, which the FaceID adapters are trained on and which the server's
# IPAdapterInsightFaceLoader downloads itself), so they are experimental (family sdxl) and the published art's allow-list never names them.
# Unlike the other experimental files they are fetched locally too (`art fetch`, hash checked): the COMFY_URL server's insightface
# failed to import on 2026-10-19 (numpy ABI mismatch), so art avatar runs them on the local ComfyUI, which needs `insightface` and
# `onnxruntime` in its venv and buffalo_l under ComfyUI/models/insightface/models/.
# Civitai style LoRAs (2026-10-19, art avatar's look experiments): non-commercial on their cards, so experimental and remote-only; their
# sha256 is Civitai's own hash of the file. The FaceID stage still runs on the local ComfyUI, so RetroArt is also copied by hand into
# the local cache's models/loras (from the API download URL in its note; hash checked against the one here).
# Dropped at fetch time (card licence outside the allow-list):
#   lineart-informative (lllyasviel/Annotators sk_model*.pth): the card says `license: other`, not MIT.
#   Replaced by anyline-mteed, from the OpenRAIL++-M MistoLine repo.
